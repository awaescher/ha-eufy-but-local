# Production setup: run next to Home Assistant, on the same LAN as the HomeBase.
services:
  eufy-but-local:
    # Published by .github/workflows/release.yml on every push to main. Tags: a version
    # (e.g. 0.1.3), 0.1, 0 or latest. To build locally instead, replace the image line with
    # "build: ." and run "docker compose up -d --build".
    image: ghcr.io/awaescher/eufy-but-local:latest
    container_name: eufy-but-local
    restart: unless-stopped
    network_mode: host # required for the local UDP/P2P connection to the HomeBase
    environment:
      TZ: "Europe/Berlin"
      BRIDGE_PORT: "3080"
      # Strongly recommended. Enter the same value in the Home Assistant integration.
      BRIDGE_TOKEN: "change-me"
      # Optional: pin the HomeBase address (the serial is printed in the log on first start)
      # HOMEBASE_IP: "192.168.1.50"
      # HOMEBASE_SERIAL: "T8010..."
    volumes:
      # Session and credentials (file mode 600). Must be writable by uid 1000 (user "node").
      - ./data:/data
