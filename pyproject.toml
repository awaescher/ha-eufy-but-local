[project]
name = "ha-eufy-but-local"
version = "0.1.0"
description = "Eufy But Local: Eufy HomeBase 2 integration with local events, thumbnails and live view"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Andreas Wäscher" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components/eufy_but_local"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
# Same import style as Home Assistant core.
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["custom_components"]
