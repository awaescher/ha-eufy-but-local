[project]
name = "ha-local-eufy-cams"
version = "0.1.0"
description = "Home Assistant integration for Eufy HomeBase 2 with local events, thumbnails and live view"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Andreas Wäscher" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components/eufy_local"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
